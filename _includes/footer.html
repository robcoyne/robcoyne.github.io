<footer class="footer">
    {% for item in site.data.settings.social %}
    <a href="{{ item.link }}" class="menu-link" target="_blank">
      {% if item.icon == "square-envelope" %}
        <i class="fa-solid fa-{{ item.icon }} fa-lg" aria-hidden="true"></i>
      {% else %}
        <i class="fa-brands fa-{{ item.icon }} fa-lg" aria-hidden="true"></i>
      {% endif %}
    </a>
  {% endfor %}
  <div class="footer-description"><a href="{{ site.github.url }}/">{{ site.title }} | {{ site.description }} by {{ site.author }}</a></div>
</footer>
